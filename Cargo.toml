[workspace]
resolver = "2"
members = ["crates/audio-protocol", "crates/audio-codec", "crates/audio-transport", "crates/desktop-agent", "crates/linux-receiver"]  # more crates are added as each milestone lands

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Shreyas Salankimatt"]

[workspace.dependencies]
chacha20poly1305 = "0.10"
thiserror = "2"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "std", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
