name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libopus-dev
      - run: cargo test --workspace

  # Windows: the protocol, codec and transport crates must build and pass their tests.
  # The agent and receiver are added here as they are made portable.
  windows:
    runs-on: windows-latest
    env:
      # the Opus sources bundled with audiopus_sys ask for an old CMake minimum that new CMake rejects
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      # one handshake test does about 12,000 Noise handshakes; unoptimised that took over 6 minutes here
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p audio-protocol -p audio-codec -p audio-transport
