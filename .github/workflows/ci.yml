name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # weekly, so new advisories against the locked dependencies show up

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libopus-dev
      - run: cargo test --workspace

  # Windows: the protocol, codec and transport crates must build and pass their tests.
  # The agent and receiver are added here as they are made portable.
  windows:
    runs-on: windows-latest
    env:
      # the Opus sources bundled with audiopus_sys ask for an old CMake minimum that new CMake rejects
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      # one handshake test does about 12,000 Noise handshakes; unoptimised that took over 6 minutes here
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p audio-protocol -p audio-codec -p audio-transport
      # the agent and receiver must at least build, and their unit tests (not the Linux-audio end-to-end ones) pass
      - run: cargo build -p meshwav -p meshwav-agent -p meshwav-receiver
      - run: cargo test --lib -p meshwav-agent -p meshwav-receiver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-debug-binaries
          path: |
            target/debug/meshwav.exe
          retention-days: 3

  # Known-vulnerable, yanked or unexpected-source dependencies fail the build (see deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-deny --version 0.22.1
      - run: cargo deny check advisories bans sources
