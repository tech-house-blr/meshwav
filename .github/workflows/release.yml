name: Release

# A v* tag builds the packages for x86_64 and aarch64 and publishes them as a GitHub release.
# A pull request that touches packaging, and "Run workflow", build and check everything but publish nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', '.github/workflows/release.yml', 'scripts/install-user-service.sh']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libopus-dev rpm desktop-file-utils
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }
      - run: cargo build --release --locked -p meshwav
      - name: Packages
        run: |
          sh packaging/build-deb.sh target/release/meshwav dist
          sh packaging/build-rpm.sh target/release/meshwav dist
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          t=meshwav-$v-linux-${{ matrix.arch }}
          mkdir -p "$t" && cp target/release/meshwav packaging/systemd/meshwav-agent.service packaging/config.toml.example LICENSE scripts/install-user-service.sh "$t/"
          tar czf "dist/$t.tar.gz" "$t"
      - name: Check the packages
        run: |
          for f in dist/*.deb; do dpkg-deb -I $f; dpkg-deb -c $f; done
          for f in dist/*.rpm; do rpm -qpi $f; rpm -qpl $f; rpm -qp --requires $f; done
          dpkg-deb -x dist/meshwav_*.deb /tmp/deb
          desktop-file-validate /tmp/deb/usr/share/applications/meshwav.desktop
          /tmp/deb/usr/bin/meshwav --help | head -3
          /tmp/deb/usr/bin/meshwav send --bind 127.0.0.1:1 --log-level nope 2>&1 | grep "not one of"
          grep -x "ExecStart=/usr/bin/meshwav send" /tmp/deb/usr/lib/systemd/user/meshwav-agent.service
      - run: cd dist && sha256sum * > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
