name: Probe
on:
  push:
    paths: ['crates/loopback-probe/**']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path crates/loopback-probe/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: loopback-probe
          path: crates/loopback-probe/target/release/loopback-probe.exe
          retention-days: 2
