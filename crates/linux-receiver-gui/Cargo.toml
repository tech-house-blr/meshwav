[package]
name = "meshwav-receiver-gui"
description = "Meshwav Linux receiver window: pairing, connection state, volume"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "meshwav_receiver_gui"
path = "src/lib.rs"

[[bin]]
name = "meshwav-receiver-gui"
path = "src/main.rs"

[dependencies]
meshwav-receiver = { path = "../linux-receiver" }
png = "0.18"

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "0.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
