[package]
name = "meshwav-agent"
description = "Meshwav desktop agent: captures system audio, encodes Opus and streams it over the tailnet"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "meshwav_agent"
path = "src/lib.rs"

[[bin]]
name = "meshwav-agent"
path = "src/main.rs"

[dependencies]
audio-protocol = { path = "../audio-protocol" }
audio-codec = { path = "../audio-codec" }
audio-transport = { path = "../audio-transport" }
getrandom = { version = "0.2", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
cpal = "0.15"
windows = { version = "0.54", features = ["implement", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
